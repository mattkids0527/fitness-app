<!doctype html>
<html lang="zh-Hant-TW">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
        <title>M4 照片分析 demo</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <header class="toolbar">
            <h1>M4 照片分析</h1>
            <div class="group">
                <span class="group-label">主題</span>
                <button data-tool="theme" data-value="light" class="on">淺色</button>
                <button data-tool="theme" data-value="dark">深色</button>
            </div>
            <div class="group">
                <span class="group-label">裝置</span>
                <button data-tool="device" data-value="phone" class="on">手機</button>
                <button data-tool="device" data-value="desktop">桌機</button>
            </div>
            <div class="group">
                <label class="group-label" for="tool-result">分析結果</label>
                <select id="tool-result" data-tool="result">
                    <option value="ok">成功</option>
                    <option value="not_food">看不出食物</option>
                    <option value="busy">Gemini 忙碌（免費層限制）</option>
                    <option value="timeout">逾時</option>
                    <option value="failed">其他錯誤</option>
                </select>
            </div>
            <div class="group">
                <label class="group-label" for="tool-quota">今天剩餘</label>
                <select id="tool-quota" data-tool="quota">
                    <option value="17">17 次</option>
                    <option value="1">1 次</option>
                    <option value="0">0 次（已達上限）</option>
                </select>
            </div>
            <div class="group">
                <button data-tool="reset">從頭開始</button>
            </div>
        </header>

        <main>
            <section class="topic">
                <h2>流程試玩</h2>
                <p>
                    從 ＋ 選單開始：選「拍照」或「上傳照片」→ 分析 → 確認表單 →
                    儲存。上方工具列可以切換分析結果與今天剩餘次數。在分析頁按「重拍」「換一張」可以選自己的照片（只在瀏覽器裡預覽，不會上傳）。
                </p>
                <div id="flow"></div>
            </section>

            <section class="topic">
                <h2>畫面一覽</h2>
                <p>每個狀態各一張，編號對應 README 的畫面情境。</p>
                <div id="gallery" class="gallery"></div>
            </section>
        </main>

        <!-- 拍照開後鏡頭；上傳開相簿或檔案（桌機的 capture 會被忽略） -->
        <input id="file-camera" type="file" accept="image/*" capture="environment" hidden />
        <input id="file-upload" type="file" accept="image/*" hidden />

        <script src="icons.js"></script>
        <script src="app.js"></script>
    </body>
</html>
