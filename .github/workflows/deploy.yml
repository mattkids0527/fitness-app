name: deploy

# 手動部署：到 Actions → deploy → Run workflow，分支選 main、填版號（例如 v1.3.0）後執行。
# 部署成功後在該 commit 打 tag 並建立 GitHub Release；部署失敗不打 tag，同一個版號可以修好後再用。
# 部署目標與正式環境 .env 都從 Environment「production」讀取，設定方式見 deploy/README.md。
run-name: deploy ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版號（vX.Y.Z）。新功能升中間碼，修正與調整升最後一碼'
        required: true
        type: string

# 打 tag、建立 Release 需要寫入權限
permissions:
  contents: write

# 同一時間只允許一個部署；後來觸發的會排隊，不會中斷正在進行的部署
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || secrets.DEPLOY_HOST }}
      # 版號一律透過環境變數使用，不直接嵌進指令，避免輸入內容被當成指令執行
      DEPLOY_VERSION: ${{ inputs.version }}

    steps:
      - name: Only deploy main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::只能部署 main，目前選的是 ${GITHUB_REF#refs/heads/}"
          exit 1

      - name: Check production settings
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: |
          missing=()
          for name in DEPLOY_HOST DEPLOY_SSH_KEY DEPLOY_HOST_KEY PRODUCTION_ENV; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Environment production 缺少設定：${missing[*]}（設定方式見 deploy/README.md）"
            exit 1
          fi

      # 抓取完整歷史與所有 tag，才能檢查版號是否重複、是否大於目前最新版
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Version
        run: deploy/check-version.sh "$DEPLOY_VERSION"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 只是為了取得 Deployer 與前端建置需要的 Ziggy，不執行 artisan，所以加 --no-scripts
      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Install Node Dependencies
        run: npm ci

      # VM 只有 1GB 記憶體，前端在 runner 上建置後由 Deployer 上傳
      - name: Build Assets
        env:
          VITE_APP_NAME: Fitness
        run: npm run build

      # 私鑰、known_hosts、.env 都寫在 runner 的暫存目錄（權限 600），部署完一律刪除
      - name: Prepare SSH Key, Known Hosts and .env
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: |
          umask 077
          dir="$RUNNER_TEMP/deploy"
          mkdir -p "$dir" ~/.ssh

          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$dir/id_deploy"

          # 從 DEPLOY_HOST（[帳號@]IP[:路徑]）取出 IP，和 host 公鑰組成 known_hosts。
          # DEPLOY_HOST_KEY 可以只貼「ssh-ed25519 AAAA...」，也可以貼 ssh-keyscan 的整行「IP ssh-ed25519 AAAA...」
          host="${DEPLOY_HOST#*@}"
          host="${host%%:*}"
          printf '%s\n' "$DEPLOY_HOST_KEY" | tr -d '\r' \
            | awk -v host="$host" 'NF { if ($1 ~ /^(ssh-|ecdsa-)/) print host" "$1" "$2; else print host" "$2" "$3 }' \
            > "$dir/known_hosts"
          if [ ! -s "$dir/known_hosts" ]; then
            echo "::error::DEPLOY_HOST_KEY 格式不正確，應為「ssh-ed25519 AAAA...」"
            exit 1
          fi

          printf '%s\n' "$PRODUCTION_ENV" > "$dir/production.env"

          {
            echo "DEPLOY_SSH_KEY_FILE=$dir/id_deploy"
            echo "DEPLOY_KNOWN_HOSTS_FILE=$dir/known_hosts"
            echo "DEPLOY_ENV_FILE=$dir/production.env"
          } >> "$GITHUB_ENV"

      # 固定部署觸發當下的 commit，避免 VM 拉到之後才合併進 main 的程式碼
      - name: Deploy
        run: vendor/bin/dep deploy --no-interaction -v --revision="$GITHUB_SHA"

      # 部署成功才打 tag；Release 說明由 GitHub 依上一版之後合併的 PR 自動產生
      - name: Tag and Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            tag -a "$DEPLOY_VERSION" -m "Release $DEPLOY_VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$DEPLOY_VERSION"
          gh release create "$DEPLOY_VERSION" --verify-tag --title "$DEPLOY_VERSION" --generate-notes

      - name: Clean Up Secrets
        if: always()
        run: rm -rf "$RUNNER_TEMP/deploy"
