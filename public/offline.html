<!doctype html>
<html lang="zh-TW">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
        <meta name="theme-color" content="#e9590c" />
        <title>目前離線 - Fitness</title>
        <style>
            :root { color-scheme: light dark; }
            html { touch-action: manipulation; }
            body { margin: 0; min-height: 100dvh; display: grid; place-items: center; font-family: -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', sans-serif; background: #f7f7f7; color: #111; text-align: center; }
            @media (prefers-color-scheme: dark) { body { background: #0a0a0a; color: #fafafa; } p { color: #a3a3a3 !important; } }
            .mark { width: 64px; height: 64px; margin: 0 auto 16px; }
            h1 { margin: 0 0 8px; font-size: 20px; }
            p { margin: 0 0 24px; color: #737373; line-height: 1.6; }
            button { height: 44px; padding: 0 24px; border: 0; border-radius: 10px; background: #e9590c; color: #fff; font: inherit; font-weight: 600; }
        </style>
    </head>
    <body>
        <main>
            <img class="mark" src="/favicon.svg" alt="" />
            <h1>目前離線</h1>
            <p>沒有網路連線，連線恢復後再試一次。</p>
            <button type="button" onclick="location.reload()">重新整理</button>
        </main>
        <!-- iPhone Safari 忽略 user-scalable=no，另外擋下兩指縮放手勢 -->
        <script>document.addEventListener('gesturestart', function (event) { event.preventDefault(); });</script>
    </body>
</html>
