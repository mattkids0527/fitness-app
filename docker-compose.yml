# 本地開發用資料庫：只起 PostgreSQL，PHP 仍在本機以 composer dev 執行。
services:
    postgres:
        image: postgres:16
        container_name: fitness_app_postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: fitness_app
            POSTGRES_USER: fitness
            POSTGRES_PASSWORD: secret
            TZ: Asia/Taipei
        ports:
            - '54329:5432'
        volumes:
            - fitness_app_pgdata:/var/lib/postgresql/data
            - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U fitness -d fitness_app']
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    fitness_app_pgdata:
